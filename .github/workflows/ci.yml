name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job named `check` (branch protection requires it, so it always
# reports), doing only what the change needs (D134):
# - docs only (docs/, *.md): the format check;
# - code on a pull request: lint, types, unit tests (in parallel), then
#   the production build and the end-to-end tests;
# - code merged to main: lint, types, unit tests (the pull request ran
#   the end-to-end tests on the same code); run by hand for everything.
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: What changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || \
             ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=true
          else
            # Anything outside docs/ and Markdown files counts as code.
            other=$(git diff --name-only "$BASE" HEAD | grep -vE '^(docs/.*|[^/]*\.md)$' || true)
            if [ -n "$other" ]; then
              code=true
            else
              code=false
            fi
          fi
          e2e=false
          if [ "$code" = true ] && [ "$EVENT" != "push" ]; then e2e=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "code=$code e2e=$e2e"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check

      # Lint, types, and unit tests at the same time; each one's output is
      # shown, and the step fails if any of them did.
      - name: Lint, types, and unit tests
        if: steps.scope.outputs.code == 'true'
        run: |
          npm run lint > lint.log 2>&1 & lint=$!
          npm run typecheck > types.log 2>&1 & types=$!
          npm test > test.log 2>&1 & tests=$!
          status=0
          wait $lint || status=1
          wait $types || status=1
          wait $tests || status=1
          for log in lint.log types.log test.log; do
            echo "::group::$log"; cat "$log"; echo "::endgroup::"
          done
          exit $status

      # The AI eval (D150): from recordings only, a few seconds. Fails when
      # a prompt or model changed without a new recording, when
      # evals/baseline.json is stale, or when the score is below the base
      # commit's without an exception in evals/exceptions.json.
      - name: AI eval
        if: steps.scope.outputs.code == 'true'
        env:
          EVAL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run eval:check

      - name: Cache Next.js build
        if: steps.scope.outputs.e2e == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # The production build, pointed at the end-to-end tests' stand-in
      # Supabase (e2e/mock-supabase/, D32); Vercel builds the site itself.
      - if: steps.scope.outputs.e2e == 'true'
        run: npm run build:e2e

      # The browser is kept between runs (it only changes with Playwright).
      - name: Cache Playwright's browser
        if: steps.scope.outputs.e2e == 'true'
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - if: steps.scope.outputs.e2e == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.e2e == 'true' && steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # End-to-end tests against the build above (YouTube blocked in tests).
      - if: steps.scope.outputs.e2e == 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
