name: CI

on:
  pull_request:
  # Not on every merge to main any more (D163, private repo minutes): the
  # pull request ran the same checks on the same code. A full run on main
  # once a week, and by hand, catches anything two merges broke together.
  schedule:
    - cron: "23 2 * * 3"
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job named `check` (branch protection requires it, so it always
# reports), doing only what the change needs (D134):
# - docs only (docs/, *.md): the format check;
# - code on a pull request: lint, types, unit tests (in parallel), then
#   the production build and the end-to-end tests;
# - weekly on main, and by hand: everything (D163; merges to main no
#   longer run CI, to save the private repo's minutes).
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: What changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_LITE: ${{ vars.CI_LITE }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || \
             ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=true
          else
            # Anything outside docs/ and Markdown files counts as code.
            other=$(git diff --name-only "$BASE" HEAD | grep -vE '^(docs/.*|[^/]*\.md)$' || true)
            if [ -n "$other" ]; then
              code=true
            else
              code=false
            fi
          fi
          e2e=false
          if [ "$code" = true ] && [ "$EVENT" != "push" ]; then e2e=true; fi
          # Repo variable CI_LITE=on skips the end-to-end tests on pull
          # requests when the month's free minutes run low (D163); they
          # must still pass locally before pushing (CLAUDE.md).
          if [ "$EVENT" = "pull_request" ] && [ "$CI_LITE" = "on" ]; then e2e=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "code=$code e2e=$e2e"

      # Keys or passwords in this change's commits (D158): gitleaks, a
      # pinned release checked against its published checksum; known
      # non-secrets are listed in .gitleaks.toml. Runs on docs too.
      - name: Secrets in the new commits (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          v=8.30.1
          file="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v$v/$file"
          curl -sSfL -o "$RUNNER_TEMP/sums.txt" "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $file\$" sums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
          range=HEAD
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$BASE..HEAD"; fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --config .gitleaks.toml --redact --no-banner --exit-code 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check

      # Lint, types, and unit tests at the same time; each one's output is
      # shown, and the step fails if any of them did.
      - name: Lint, types, and unit tests
        if: steps.scope.outputs.code == 'true'
        run: |
          npm run lint > lint.log 2>&1 & lint=$!
          npm run typecheck > types.log 2>&1 & types=$!
          npm test > test.log 2>&1 & tests=$!
          status=0
          wait $lint || status=1
          wait $types || status=1
          wait $tests || status=1
          for log in lint.log types.log test.log; do
            echo "::group::$log"; cat "$log"; echo "::endgroup::"
          done
          exit $status

      # The AI eval (D150): from recordings only, a few seconds. Fails when
      # a prompt or model changed without a new recording, when
      # evals/baseline.json is stale, or when the score is below the base
      # commit's without an exception in evals/exceptions.json.
      - name: AI eval
        if: steps.scope.outputs.code == 'true'
        env:
          EVAL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run eval:check

      - name: Cache Next.js build
        if: steps.scope.outputs.e2e == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # The production build, pointed at the end-to-end tests' stand-in
      # Supabase (e2e/mock-supabase/, D32); Vercel builds the site itself.
      - if: steps.scope.outputs.e2e == 'true'
        run: npm run build:e2e

      # Nothing server-only in what browsers download (D159).
      - name: No secrets in the browser bundle
        if: steps.scope.outputs.e2e == 'true'
        run: node scripts/check-client-bundle.mjs

      # The browser is kept between runs (it only changes with Playwright).
      - name: Cache Playwright's browser
        if: steps.scope.outputs.e2e == 'true'
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - if: steps.scope.outputs.e2e == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.e2e == 'true' && steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # End-to-end tests against the build above (YouTube blocked in tests).
      - if: steps.scope.outputs.e2e == 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
